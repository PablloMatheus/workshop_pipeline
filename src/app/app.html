<div class="container">
  <h1>{{ title }}</h1>

  <div class="scoreboard">
    <div class="score-card" [class.active]="turn === 'X' && !winner">
      <span>Jogador X</span>
      <strong>{{ score.x }}</strong>
    </div>
    <div class="score-card" [class.active]="turn === 'O' && !winner">
      <span>Jogador O</span>
      <strong>{{ score.o }}</strong>
    </div>
  </div>

  <h2 *ngIf="winner" class="status-msg">
    {{ winner === 'Empate' ? 'Deu Velha!' : '🎉 Vencedor: ' + winner }}
  </h2>

  <div class="board">
    <div *ngFor="let cell of cells; let i = index" 
         class="cell" 
         [class.x-color]="cell === 'X'"
         [class.o-color]="cell === 'O'"
         (click)="makeMove(i)">
      {{ cell }}
    </div>
  </div>

  <div class="controls">
    <button (click)="reset()" class="btn-reset">Nova Rodada</button>
  </div>

  <div class="history-panel" *ngIf="history.length > 0">
    <h3>Histórico da Partida</h3>
    <ul>
      <li *ngFor="let step of history">{{ step }}</li>
    </ul>
  </div>
</div>
